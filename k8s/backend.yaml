apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-admin-service
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-admin-service
  template:
    metadata:
      labels:
        app: auth-admin-service
    spec:
      containers:
        - name: auth-admin-service
          image: smart-healthcare/auth-admin-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/auth_admin_db"
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/auth_admin_db"
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-healthcare-config
                  key: CLIENT_URL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: smart-healthcare-config
                  key: APP_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: SMTP_FROM
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-admin-service
  namespace: smart-healthcare
spec:
  selector:
    app: auth-admin-service
  ports:
    - port: 4000
      targetPort: 4000
---
