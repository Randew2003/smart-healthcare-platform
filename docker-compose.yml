services:
  mongo:
    image: mongo:7
    container_name: healthcare-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-admin-service:
    build: ./services/auth-admin-service
    container_name: auth-admin-service
    restart: unless-stopped
    env_file:
      - ./services/auth-admin-service/.env
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/auth_admin_db?appName=Cluster0"
      MONGODB_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/auth_admin_db?appName=Cluster0"
      JWT_SECRET: "smarthealthcare_dev_jwt_secret_change_me"
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  appointment-service:
    build: ./services/appointment-service
    container_name: appointment-service
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/appointment_db?appName=Cluster0"
    ports:
      - "4001:4001"
    depends_on:
      - mongo

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    env_file:
      - ./services/notification-service/.env
    ports:
      - "4002:4002"

  patient-service:
    build: ./services/patient-service
    container_name: patient-service
    restart: unless-stopped
    env_file:
      - ./services/patient-service/.env
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/patient_db?appName=Cluster0"
      JWT_SECRET: "smarthealthcare_dev_jwt_secret_change_me"
    ports:
      - "4003:4003"
    depends_on:
      - mongo

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    restart: unless-stopped
    env_file:
      - ./services/payment-service/.env
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/payment_db?appName=Cluster0"
      JWT_SECRET: "smarthealthcare_dev_jwt_secret_change_me"
    ports:
      - "4004:4004"
    depends_on:
      - mongo

  doctor-service:
    build: ./services/doctor-service
    container_name: doctor-service
    restart: unless-stopped
    env_file:
      - ./services/doctor-service/.env
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/doctor_db?appName=Cluster0"
      APPOINTMENT_SERVICE_URL: "http://appointment-service:4001"
      PATIENT_SERVICE_URL: "http://patient-service:4003"
    ports:
      - "4005:4005"
    depends_on:
      - mongo
      - appointment-service
      - patient-service

  telemedicine-service:
    build: ./services/telemedicine-service
    container_name: telemedicine-service
    restart: unless-stopped
    env_file:
      - ./services/telemedicine-service/.env
    environment:
      MONGO_URI: "mongodb+srv://meghapromotacc_db_user:nOjGMwusX3uetJXe@cluster0.8ggqmhz.mongodb.net/telemedicine_db?appName=Cluster0"
    ports:
      - "4006:4006"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth-admin-service
      - appointment-service
      - patient-service
      - doctor-service
      - telemedicine-service
      - payment-service
      - notification-service
      
volumes:
  mongo_data:



  